<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>碳因子查 · 核算器</title>
<style>
:root{--bg:#0b0e1a;--card:#141a2e;--card2:#1a2138;--ink:#e8eaf2;--muted:#8b90a8;--accent:#34d399;--accent2:#7c7cf4;--border:#232a45;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.6;}
.top{padding:18px 16px 12px;max-width:860px;margin:0 auto;}
.top h1{margin:0;font-size:19px;}
.top h1 small{display:block;color:var(--muted);font-weight:400;font-size:12px;margin-top:4px;}
.tabs{display:flex;gap:8px;max-width:860px;margin:0 auto;padding:0 16px;}
.tabs button{flex:1;background:var(--card);color:var(--muted);border:1px solid var(--border);border-radius:10px;padding:10px 0;font-size:14px;cursor:pointer;}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#06281c;font-weight:700;}
.tabs button .n{background:#e11d48;color:#fff;border-radius:10px;font-size:11px;padding:1px 7px;margin-left:4px;}
.wrap{max-width:860px;margin:0 auto;padding:12px 16px 40px;}
.bar{position:sticky;top:0;background:rgba(11,14,26,.96);padding:10px 0;z-index:20;backdrop-filter:blur(6px);}
.scopes{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap;}
.scopes button{background:var(--card);color:var(--muted);border:1px solid var(--border);border-radius:20px;padding:6px 14px;font-size:13px;cursor:pointer;}
.scopes button.on{background:var(--accent2);border-color:var(--accent2);color:#fff;}
.row{display:flex;gap:8px;}
input[type=text],input[type=number],select{background:var(--card2);border:1px solid var(--border);color:var(--ink);border-radius:10px;padding:11px 12px;font-size:14px;width:100%;outline:none;}
input:focus,select:focus{border-color:var(--accent);}
#q{flex:3;} #sub{flex:2;}
.count{color:var(--muted);font-size:12px;margin:8px 2px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:13px 14px;margin-bottom:10px;}
.card .tag{font-size:11px;color:var(--accent2);border:1px solid var(--accent2);border-radius:6px;padding:1px 7px;margin-right:6px;}
.card .tag.s1{color:#34d399;border-color:#34d399;}
.card .tag.s2{color:#fbbf24;border-color:#fbbf24;}
.card .tag.s3{color:#7c7cf4;border-color:#7c7cf4;}
.card .tag.gwp{color:#f472b6;border-color:#f472b6;}
.card h3{margin:6px 0 4px;font-size:15.5px;}
.card .ef{font-size:20px;font-weight:700;color:var(--accent);}
.card .ef small{font-size:12px;color:var(--muted);font-weight:400;}
.card .meta{font-size:12px;color:var(--muted);margin-top:4px;}
.card .add{margin-top:8px;width:100%;background:var(--card2);border:1px dashed var(--accent);color:var(--accent);border-radius:8px;padding:8px 0;font-size:13px;cursor:pointer;}
.card .add.added{background:var(--accent);color:#06281c;border-style:solid;font-weight:700;}
.calc{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:13px 14px;margin-bottom:10px;}
.calc h3{margin:0 0 2px;font-size:14.5px;}
.calc .efline{font-size:12.5px;color:var(--muted);}
.calc .inrow{display:flex;gap:8px;align-items:center;margin-top:8px;}
.calc .inrow input{flex:1;}
.calc .unit{color:var(--muted);font-size:13px;white-space:nowrap;}
.calc .res{font-size:16px;font-weight:700;color:var(--accent);white-space:nowrap;}
.calc .del{background:none;border:none;color:#f87171;font-size:13px;cursor:pointer;padding:6px;}
.total{background:linear-gradient(135deg,#123f31,#1a2138);border:1px solid var(--accent);border-radius:12px;padding:14px;margin:12px 0;text-align:center;}
.total b{font-size:26px;color:var(--accent);}
.btns{display:flex;gap:8px;}
.btns button{flex:1;border-radius:10px;padding:11px 0;font-size:14px;cursor:pointer;border:1px solid var(--border);}
#copy{background:var(--accent);color:#06281c;font-weight:700;border-color:var(--accent);}
#clear{background:var(--card);color:var(--muted);}
.empty{text-align:center;color:var(--muted);padding:40px 0;font-size:13px;}
.note{font-size:12px;color:var(--muted);}
footer{max-width:860px;margin:0 auto;padding:0 16px 30px;color:var(--muted);font-size:12px;}
footer a{color:var(--accent);}
</style>
</head>
<body>
<div class="top">
<h1>碳因子查 · 核算器<small>《中国企业温室气体排放核算与报告因子库（2026）》共 <b id="total-n">–</b> 条 · 查因子、算排放，一页搞定</small></h1>
</div>
<div class="tabs">
<button id="tab-q" class="on" onclick="showTab('q')">因子查询</button>
<button id="tab-c" onclick="showTab('c')">核算器<span class="n" id="calc-n" style="display:none">0</span></button>
</div>
<div class="wrap">

<div id="view-q">
<div class="bar">
<div class="scopes" id="scopes">
<button data-s="all" class="on">全部</button>
<button data-s="一">范围一</button>
<button data-s="二">范围二</button>
<button data-s="三">范围三</button>
<button data-s="GWP">GWP值</button>
</div>
<div class="row">
<input type="text" id="q" placeholder="搜：电煤 / 华东电力 / 生铁 / HFC-134a …">
<select id="sub"><option value="">全部分类</option></select>
</div>
</div>
<div class="count" id="count"></div>
<div id="results"></div>
</div>

<div id="view-c" style="display:none">
<div id="calclist"></div>
<div class="total">核算合计<br><b id="sum">0</b> <span class="note">tCO₂e</span></div>
<div class="btns">
<button id="copy">复制核算结果</button>
<button id="clear">清空</button>
</div>
<div class="empty" id="c-empty">还没有加入任何因子<br>去「因子查询」点 <b style="color:var(--accent)">＋ 加入核算</b></div>
</div>

</div>
<footer>
数据来源：《中国企业温室气体排放核算与报告因子库（2026）》（lca.cityghg.com）。<br>
核算公式：排放量 = 活动数据 × 排放因子。GWP 值为单位质量温室气体的百年增温潜势，仅供换算参考。<br>
本工具为便捷查询，正式核算与报告以最新官方文件为准。
</footer>

var state={tab:'q',scope:'all',q:'',sub:''};
var calc=[]; // {id, ad}
var calcN=document.getElementById('calc-n');
document.getElementById('total-n').textContent=ITEMS.length;
var SUBS={};
ITEMS.forEach(function(it){ (SUBS[it.scope]=SUBS[it.scope]||new Set()).add(it.sub); });
function showTab(t){
  state.tab=t;
  document.getElementById('tab-q').className=t==='q'?'on':'';
  document.getElementById('tab-c').className=t==='c'?'on':'';
  document.getElementById('view-q').style.display=t==='q'?'block':'none';
  document.getElementById('view-c').style.display=t==='c'?'block':'none';
  if(t==='c') renderCalc();
}
document.getElementById('scopes').addEventListener('click',function(e){
  var b=e.target.closest('button'); if(!b) return;
  state.scope=b.dataset.s; state.sub='';
  document.querySelectorAll('#scopes button').forEach(function(x){x.className=x.dataset.s===state.scope?'on':'';});
  var sel=document.getElementById('sub');
  var opts=['<option value="">全部分类</option>'];
  if(SUBS[state.scope]) Array.from(SUBS[state.scope]).sort().forEach(function(s){ opts.push('<option>'+s+'</option>'); });
  sel.innerHTML=opts.join('');
  renderResults();
});
document.getElementById('q').addEventListener('input',function(e){ state.q=e.target.value.trim().toLowerCase(); renderResults(); });
document.getElementById('sub').addEventListener('change',function(e){ state.sub=e.target.value; renderResults(); });
function inCalc(id){ return calc.findIndex(function(c){return c.id===id;}); }
function efNum(it){
  var v=parseFloat(String(it.ef).replace(/,/g,''));
  return isNaN(v)?null:v;
}
function tagCls(s){ return s==='一'?'s1':s==='二'?'s2':s==='三'?'s3':'gwp'; }
function scopeName(s){ return s==='GWP'?'GWP值':'范围'+s; }
function renderResults(){
  var list=ITEMS.filter(function(it){
    if(state.scope!=='all'&&it.scope!==state.scope) return false;
    if(state.sub&&it.sub!==state.sub) return false;
    if(state.q){
      var hay=(it.name+' '+it.sub+' '+it.unit+' '+(it.src||'')).toLowerCase();
      if(hay.indexOf(state.q)<0) return false;
    }
    return true;
  }).slice(0,120);
  document.getElementById('count').textContent='共 '+list.length+' 条'+(list.length>=120?'（仅显示前120条，请细化搜索）':'');
  var html=list.map(function(it){
    var added=inCalc(it.id)>=0;
    var efHtml;
    if(it.scope==='GWP'){
      efHtml='<div class="ef">AR5 '+it.ar5+' <small>/ AR6 '+it.ar6+'</small></div><div class="meta">'+it.formula+'</div>';
    }else{
      efHtml='<div class="ef">'+it.ef+' <small>'+it.efunit+'</small></div>';
    }
    var btn=it.scope==='GWP'?'':'<button class="add'+(added?' added':'')+'" data-id="'+it.id+'">'+(added?'已加入核算 ✓':'＋ 加入核算')+'</button>';
    return '<div class="card"><span class="tag '+tagCls(it.scope)+'">'+scopeName(it.scope)+'</span><span class="note">'+it.sub+'</span>'+
      '<h3>'+it.name+'</h3>'+efHtml+
      (it.src?'<div class="meta">来源：'+it.src.slice(0,60)+'</div>':'')+
      (it.note?'<div class="meta">备注：'+it.note.slice(0,80)+'</div>':'')+btn+'</div>';
  }).join('');
  document.getElementById('results').innerHTML=html||'<div class="empty">没有匹配的因子，换个关键词试试</div>';
}
document.getElementById('results').addEventListener('click',function(e){
  var b=e.target.closest('.add'); if(!b) return;
  var id=b.dataset.id, i=inCalc(id);
  if(i>=0){ calc.splice(i,1); } else { calc.push({id:id,ad:''}); }
  var n=calc.length;
  calcN.style.display=n?'inline':'none'; calcN.textContent=n;
  renderResults();
});
function calcE(it,ad){
  var ef=efNum(it); if(ef===null||!(ad>0)) return null;
  var mult=/^kg/i.test(it.efunit)?0.001:1;
  return ad*ef*mult;
}
function renderCalc(){
  var box=document.getElementById('calclist');
  document.getElementById('c-empty').style.display=calc.length?'none':'block';
  box.innerHTML=calc.map(function(c){
    var it=ITEMS.find(function(x){return x.id===c.id;});
    var e=calcE(it,parseFloat(c.ad));
    var res=e===null?'—':(e<0.01?e.toFixed(4):e<10?e.toFixed(3):e.toFixed(1));
    return '<div class="calc" data-id="'+it.id+'"><h3>'+it.name+'</h3>'+
      '<div class="efline">'+it.ef+' '+it.efunit+(efNum(it)===null?' <span style="color:#f87171">（因子为范围值，请按备注手动取值）</span>':'')+'</div>'+
      '<div class="inrow"><input type="number" inputmode="decimal" placeholder="活动数据" value="'+c.ad+'" data-ad="'+it.id+'">'+
      '<span class="unit">'+it.unit+'</span><span class="res">'+res+'</span><span class="unit">tCO₂e</span>'+
      '<button class="del" data-del="'+it.id+'">删除</button></div></div>';
  }).join('');
  var sum=0;
  calc.forEach(function(c){
    var it=ITEMS.find(function(x){return x.id===c.id;});
    var e=calcE(it,parseFloat(c.ad)); if(e!==null) sum+=e;
  });
  document.getElementById('sum').textContent=sum<0.01?sum.toFixed(4):sum<100?sum.toFixed(2):sum.toFixed(0);
}
document.getElementById('calclist').addEventListener('input',function(e){
  var inp=e.target.closest('[data-ad]'); if(!inp) return;
  var c=calc.find(function(x){return x.id===inp.dataset.ad;});
  if(c){ c.ad=inp.value; }
  var it=ITEMS.find(function(x){return x.id===inp.dataset.ad;});
  var e2=calcE(it,parseFloat(inp.value));
  var resEl=inp.parentElement.querySelector('.res');
  resEl.textContent=e2===null?'—':(e2<0.01?e2.toFixed(4):e2<10?e2.toFixed(3):e2.toFixed(1));
  var sum=0;
  calc.forEach(function(cc){
    var ii=ITEMS.find(function(x){return x.id===cc.id;});
    var ee=calcE(ii,parseFloat(cc.ad)); if(ee!==null) sum+=ee;
  });
  document.getElementById('sum').textContent=sum<0.01?sum.toFixed(4):sum<100?sum.toFixed(2):sum.toFixed(0);
});
document.getElementById('calclist').addEventListener('click',function(e){
  var b=e.target.closest('[data-del]'); if(!b) return;
  calc=calc.filter(function(c){return c.id!==b.dataset.del;});
  var n=calc.length; calcN.style.display=n?'inline':'none'; calcN.textContent=n;
  renderCalc();
});
document.getElementById('clear').addEventListener('click',function(){
  calc=[]; calcN.style.display='none'; renderCalc();
});
document.getElementById('copy').addEventListener('click',function(){
  var lines=['碳排放核算（因子库2026）'];
  calc.forEach(function(c){
    var it=ITEMS.find(function(x){return x.id===c.id;});
    var e=calcE(it,parseFloat(c.ad));
    lines.push('· '+it.name+'：'+(c.ad||'—')+' '+it.unit+' × '+it.ef+' '+it.efunit+' = '+(e===null?'—':e.toFixed(3))+' tCO₂e');
  });
  lines.push('合计：'+document.getElementById('sum').textContent+' tCO₂e');
  var t=lines.join('\n');
  if(navigator.clipboard){ navigator.clipboard.writeText(t).then(function(){ alert('已复制到剪贴板'); }); }
  else{ prompt('复制以下结果：',t); }
});
renderResults();
</script>
