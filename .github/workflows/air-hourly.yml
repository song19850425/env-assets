# 大气管家 · 豫北小时采集 + 出报（云端，不依赖本机开机）
#
# ⛔⛔ 2026-10-17 起**已暂停自动触发**（只保留手动 workflow_dispatch）。
#    原因：平台接口对 Azure 出口不可达，每次运行必死在采集步、吃满 15 分钟超时，
#    自 10-08T23:55Z 起零提交。恢复前先换国内出口（cloud/scf_handler.py）。
#    详见下方 `on:` 段的完整记录。本机 run_hourly.py 仍在正常采集，未受影响。
#
# 为什么需要它：平台不提供小时级历史接口（实测 404），点位小时值只有实时接口能拿。
# 本机定时任务关机即停，因此必须由云端采集；报告同理 —— 本机不跑，公开页就停在旧日期。
#
# 部署位置：env-assets/.github/workflows/air-hourly.yml
# 模块目录：env-assets/EnvData/08-大气管家/豫北每日一页纸/
#   采集脚本  scripts/air_collect.py        （小时点位值 + 气象 → data-hourly/*.jsonl）
#   看板脚本  scripts/report_cloud_hourly.py（读 data-hourly → hourly/index.html，豫北四市）
#   日报脚本  scripts/report_cloud.py       （AIR_PROFILE=yubei → daily/；=yuxi → yuxi/）
#   周期脚本  scripts/report_cloud_period.py（→ weekly/ monthly/，豫北四市）
#   ⚠️ scripts/ 下全部由项目 deploy_github.py 自动镜像，勿手工改仓库内副本
#
# 公开页（GitHub Pages，推送后自动重建）：
#   https://song19850425.github.io/env-assets/air.html  ← 短链入口
#   https://song19850425.github.io/env-assets/EnvData/08-大气管家/豫北每日一页纸/
#
# ✅ 跨境可达性已实测确认（2026-09-24）：海外 runner 能正常访问 air.cnemc.cn:18007，
#    首轮运行 success，4/4 城市、117 条记录、零错误。原"头号未验证风险"已排除。
#    若日后 ok=false 且错误为超时/连接失败，再改用国内节点方案（见同目录 scf_handler.py）。
# 2026-10-01 城市池由 4 城（豫北）扩到 9 城（豫北四市 + 豫西六市，新乡共用），
#    目的是让豫西日报也能在云端每小时刷新；采集耗时随之增加，但仍是同一批 HTTP 请求。
#
# 2026-10-02 小时覆盖率修复（重要）：
#    实测 09-28~10-02 云端仅 24 帧 / 5 天 ≈ 4.8 帧/天（≈20% 覆盖），且时段集中在
#    02 / 06–09 / 13–17 / 20–23 —— 10:00–12:00 与 18:00–19:00 几乎从不覆盖，
#    而这恰是臭氧生成的日内高峰段，漏采代价最大。
#    对策：cron 由每小时 1 次改为 4 次（见下），并开启 concurrency 取消排队。
#
# 已知行为（GitHub 官方文档）：
#  - 最小间隔 5 分钟；cron 为尽力而为，高峰延迟 5–30 分钟属正常，无 SLA
#  - 仅默认分支（main）上的工作流会按计划触发
#  - 公开仓库：60 天无活动会自动停用计划任务（本工作流每小时提交，天然保持活跃）
#  - ⚠️ 实测补充（2026-09-24）：**新建的 workflow，cron 不一定会立刻生效**
#    （创建后 100 分钟、跨过 2 个整点仍未出现 schedule 运行记录）。故除 cron 外还挂了
#    "脚本有改动就 push 触发一次"的冒烟测试，改完代码能立刻拿到云端结论，不用干等。
#  - ⚠️ 实测补充（2026-10-02）：单点 cron 的实际命中率远低于"每小时一次"的预期
#    （GitHub 会丢弃高负载时段的调度事件，且不会排队补跑）。故改为单条多值 cron。
#    核对定时是否真的在跑（公开仓库免 token）：
#      GET https://api.github.com/repos/song19850425/env-assets/actions/workflows/air-hourly.yml/runs
#    或本机一行命令：py .cloud_sim/watch_cloud_run.py 600

name: 大气管家 · 小时采集与出报

on:
  # ⛔ 2026-10-17 起**暂停全部自动触发**（用户决定先停掉这条线，等换国内出口再议）。
  #
  # 停用原因（已用 GitHub 公共 API 核实，非猜测）：
  #   ① 平台接口对 Azure 出口自 10-09 后不可达。10-15 那次还是 `Connection refused`
  #      （采集 111 秒快速失败）；之后变成连接黑洞——每城重试 3 次 × 超时 30 秒 × 9 城
  #      ≈ 810 秒 + 退避 80 秒 ≈ 900 秒，正好吃满下方 `timeout-minutes: 15`。
  #   ② 于是每次运行都死在第 4 步「采集」，后续「生成看板/出报/提交推送」全部 skipped
  #      → 自 10-08T23:55Z 起零提交。近 100 次运行：success 58 / cancelled 39 / failure 3。
  #   ③ 再叠加 GH cron 实测只有 3–7 次/天（设计 96 次/天），即使通了也只有 4–6 帧/天。
  # 结论：留着自动跑只会每小时白烧 15 分钟并刷 cancelled 噪音，零产出。
  #
  # 恢复办法：把下面 schedule / push 两段取消注释即可（其余不用改）；
  #           但**先解决跨境可达性**，否则恢复了还是同样的死法。
  #           首选方案是改用国内出口跑 cloud/scf_handler.py（腾讯云 SCF 定时器）。
  #
  # 原配置（每小时 4 次，第 7 / 22 / 37 / 52 分；实测把覆盖率由 ~20% 抬到 ~50%+）：
  # schedule:
  #   - cron: '7,22,37,52 * * * *'

  workflow_dispatch:        # 保留手动触发：需要时可在 Actions 页点一下，或 API 触发

  # ⛔ push 触发同步停用：保留它等于"改个脚本就自动跑一次必然超时的任务"，
  #    反而会把 15 分钟的 cancelled 噪音带回来。要冒烟测试请手动 dispatch。
  # 原配置（脚本/工作流有改动时跑一次，兼作冒烟测试）：
  # push:
  #   branches: [main]
  #   paths:
  #     - 'EnvData/08-大气管家/豫北每日一页纸/scripts/**'
  #     - '.github/workflows/air-hourly.yml'

permissions:
  contents: write

concurrency:
  group: air-hourly
  # 2026-10-02 改为 true：每小时 4 次调度后，若某轮运行超过 15 分钟（timeout 上限），
  # cancel-in-progress:false 会让后续轮次排队堆积，导致采到的都是过期帧。
  # 改为 true 后新轮次会取消仍在跑的旧轮次；因为空跑很便宜（实测约 1–2 分钟），
  # "取消旧轮、立即用最新数据跑"比"排队等旧的跑完"更符合采集新鲜度的目标。
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 双保险：即便将来改成 PAT 推送（会自激），机器人自己的提交也不会再触发
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, 'data(air)')
    # 禁止 Python 写 __pycache__：脚本目录被整目录 git add，.pyc 二进制文件一旦入仓
    # 就会随每次代码改动产生二进制 diff，越滚越大（2026-09-24 实测已误提交 8 个 .pyc）。
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 采集（点位小时值 + 气象）
        run: python "EnvData/08-大气管家/豫北每日一页纸/scripts/air_collect.py" "EnvData/08-大气管家/豫北每日一页纸/data-hourly"

      - name: 打印健康状态（首轮用于确认跨境可达性）
        run: |
          echo "=== _health.json ==="
          cat "EnvData/08-大气管家/豫北每日一页纸/data-hourly/_health.json"

      - name: 压缩历史（保留近 3 天明文，更早的 gzip）
        run: |
          cd "EnvData/08-大气管家/豫北每日一页纸/data-hourly"
          find . -name '[0-9]*.jsonl' -mtime +3 -exec gzip -f {} \;

      - name: 生成小时序列看板（读 data-hourly JSONL，Pages 上随采集自动刷新）
        run: python "EnvData/08-大气管家/豫北每日一页纸/scripts/report_cloud_hourly.py"

      - name: 生成小时序列看板 · 豫西六市（同一套渲染，板块 hourly-yuxi/）
        env:
          AIR_PROFILE: yuxi
        run: python "EnvData/08-大气管家/豫北每日一页纸/scripts/report_cloud_hourly.py"

      - name: 生成日报 · 豫北四市（云端出报，本机关机也能刷新公开页）
        run: python "EnvData/08-大气管家/豫北每日一页纸/scripts/report_cloud.py"

      # 同一份脚本跑第二遍即出豫西日报：档案用环境变量切换（见 report_cloud.py 的
      # AIR_PROFILE / config.PROFILES），不复制第二份脚本 —— 复制就意味着两套口径要各自维护。
      - name: 生成日报 · 豫西六市（同一套口径，板块 yuxi/）
        env:
          AIR_PROFILE: yuxi
        run: python "EnvData/08-大气管家/豫北每日一页纸/scripts/report_cloud.py"

      - name: 生成周报 / 月报（周期报告，按"内容不变不落盘"避免 hourly 空提交）
        run: python "EnvData/08-大气管家/豫北每日一页纸/scripts/report_cloud_period.py"

      # if: always() —— 上游任一步失败（如跨境取数抖动）时，本次已采到的数据仍要提交，
      # 否则一小时的数据白采；同时该 run 依旧显示失败，告警不会被静默。
      - name: 提交并推送
        if: always()
        run: |
          git config user.name  "air-bot"
          git config user.email "air-bot@users.noreply.github.com"
          git add -A "EnvData/08-大气管家/豫北每日一页纸"
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "data(air): 采集 + 日报/周报/月报 $(date -u +%FT%TZ)"
            git push
          fi
