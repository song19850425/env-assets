</head>

    const n=r.items.length;const done=r.items.filter(it=>getState(it.id)).length;
    html+=`<div class="role" data-idx="${i}"><div class="role-header">
      <div class="num">${i+1}</div><span class="title">${r.role}</span>
      <span class="count">${done}/${n}</span><span class="arrow">▾</span></div>
      <div class="role-body" id="roleBody${i}">`;
    r.items.forEach(it=>{
      const s=getState(it.id);
      html+=`<div class="item" data-itemid="${it.id}"><div class="item-head">
        <div class="cb ${s?'checked':''}"></div>
        <div class="item-area"><div class="txt">${it.t}</div>
        <div class="item-key">🔍 核查要点：${it.key}</div></div>
        <span class="expand">▾</span></div>
        <div class="item-detail">
          <div class="lab">📋 准备指引</div><div class="txt">${it.guide}</div>
          <div class="note-lab">📝 我的备注 / 现场记录</div>
          <textarea class="note" data-nid="${it.id}" placeholder="记录本岗位现状、待办、缺口…（自动保存到本机）"></textarea>
          <div class="rect-row"><span class="rl">整改状态</span>
            <select class="rect s-none" data-rid="${it.id}">
              <option value="none">无</option><option value="todo">待整改</option>
              <option value="doing">整改中</option><option value="done">已关闭</option>
            </select></div>
        </div></div>`;
    });
    html+=`</div></div>`;
  });
  app.innerHTML=html;
  app.querySelectorAll('.note').forEach(ta=>{ta.value=getNote(ta.dataset.nid);});
  app.querySelectorAll('.rect').forEach(sel=>{const v=getRect(sel.dataset.rid);sel.value=v;sel.className='rect s-'+v;});
  updateProgress();
}
document.addEventListener('input',function(e){const ta=e.target.closest('.note');if(ta)setNote(ta.dataset.nid,ta.value);});
document.addEventListener('change',function(e){const sel=e.target.closest('.rect');if(sel){const v=sel.value;setRect(sel.dataset.rid,v);sel.className='rect s-'+v;}});
document.addEventListener('click',function(e){
  const cb=e.target.closest('.item-head .cb');
  if(cb){const item=cb.closest('.item');const id=item.dataset.itemid;const v=!getState(id);setState(id,v);cb.classList.toggle('checked',v);updateProgress();
    const role=item.closest('.role');const idx=parseInt(role.dataset.idx);
    const did=DATA[idx].items.filter(it=>getState(it.id)).length;
    role.querySelector('.count').textContent=did+'/'+DATA[idx].items.length;return;}
  const head=e.target.closest('.item-head');
  if(head){head.classList.toggle('open');const det=head.nextElementSibling;if(det&&det.classList.contains('item-detail'))det.classList.toggle('open');return;}
  const rh=e.target.closest('.role-header');
  if(rh){rh.classList.toggle('open');rh.nextElementSibling.classList.toggle('open');}
});
function updateProgress(){
  let total=0,done=0;DATA.forEach(r=>r.items.forEach(it=>{total++;if(getState(it.id))done++}));
  document.getElementById('progText').textContent='已核查 '+done+' / '+total+' 项';
  const pct=total>0?Math.round(done/total*100):0;
  document.getElementById('progPct').textContent=pct+'%';
  const fill=document.getElementById('progFill');fill.style.width=pct+'%';
  fill.className='fill'+(pct<30?' warn':pct<80?'':' good');
}
render();
</script>
