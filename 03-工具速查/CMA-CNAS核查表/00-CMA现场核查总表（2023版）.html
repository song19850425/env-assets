<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CMA现场核查总表（2023版）</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Source Han Sans SC","Microsoft YaHei",-apple-system,sans-serif;background:#f6f3ec;color:#2b2b2b;line-height:1.75;font-size:14px}
.cover{background:#14365c;padding:28px 24px 20px;text-align:center;border-bottom:3px solid #9e2b25}
.cover .tag{display:inline-block;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.35);color:#e8eef4;padding:3px 12px;border-radius:4px;font-size:11px;letter-spacing:1px}
.cover h1{font-family:"Source Han Serif SC","Songti SC","SimSun",serif;font-size:22px;margin:10px 0 4px;color:#fff;font-weight:700}
.cover .sub{color:#c9d4de;font-size:13px}
.cover .meta{margin-top:8px;color:#9fb0bf;font-size:11px}
.wrap{max-width:960px;margin:0 auto;padding:16px 20px 60px}

/* 进度条 */
.progress-bar{background:#fff;border:1px solid #d8d0c0;border-radius:8px;padding:14px 18px;margin-bottom:14px}
.progress-bar .info{display:flex;justify-content:space-between;font-size:13px;color:#14365c;font-weight:600;margin-bottom:6px}
.progress-bar .track{height:8px;background:#e8eef4;border-radius:4px;overflow:hidden}
.progress-bar .fill{height:100%;background:#2e6b3e;border-radius:4px;transition:width .4s;width:0%}
.progress-bar .fill.warn{background:#a8761b}
.progress-bar .fill.good{background:#2e6b3e}

/* 要素面板 */
.elem{margin-bottom:10px;border:1px solid #d8d0c0;border-radius:8px;overflow:hidden;background:#fff}
.elem-header{display:flex;align-items:center;padding:12px 16px;cursor:pointer;background:#faf8f3;user-select:none;transition:background .2s}
.elem-header:hover{background:#f0ede4}
.elem-header .num{width:28px;height:28px;border-radius:50%;background:#14365c;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.elem-header .title{flex:1;margin:0 12px;font-weight:600;font-size:14px;color:#14365c}
.elem-header .count{font-size:12px;color:#888;white-space:nowrap;margin-right:10px}
.elem-header .arrow{transition:transform .3s;font-size:14px;color:#888}
.elem-header.open .arrow{transform:rotate(180deg)}
.elem-body{display:none;padding:0 16px 14px;border-top:1px solid #e8eef4}
.elem-body.open{display:block}

/* 核查项 */
.item{margin:8px 0;border:1px solid #e8eef4;border-radius:6px;overflow:hidden}
.item-head{display:flex;align-items:flex-start;padding:10px 12px;cursor:pointer;gap:8px;transition:background .15s}
.item-head:hover{background:#f8f6f0}
.item-head .cb{width:18px;height:18px;border:2px solid #b8b0a0;border-radius:3px;flex-shrink:0;margin-top:3px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;transition:.2s;background:#fff}
.item-head .cb.checked{background:#2e6b3e;border-color:#2e6b3e;color:#fff}
.item-head .cb.checked::after{content:"✓"}
.item-head .item-area{flex:1;min-width:0}
.item-head .txt{font-size:13.5px;color:#333;font-weight:500}
.item-head .item-key{font-size:12px;color:#2f5e8a;margin-top:4px;line-height:1.55;padding:4px 8px;background:#e8eef4;border-radius:4px}
.item-head .expand{font-size:11px;color:#b8b0a0;transition:transform .3s;flex-shrink:0;margin-top:4px}
.item-head.open .expand{transform:rotate(180deg)}
.item-detail{display:none;padding:0 12px 10px;margin-left:28px;border-top:1px solid #f0ede4;background:#faf8f3;border-radius:0 0 6px 6px}
.item-detail.open{display:block}
.item-detail .lab{font-size:11.5px;font-weight:600;color:#2f5e8a;margin-top:8px}
.item-detail .txt{font-size:12.5px;color:#444;line-height:1.6;margin:2px 0 0}
.item-detail .nc{background:#f3e7e6;border-left:3px solid #9e2b25;padding:6px 10px;margin:6px 0;border-radius:0 4px 4px 0;font-size:12px;color:#333}
.item-detail .doc{font-size:12px;color:#2e6b3e;line-height:1.6;margin:2px 0 6px;padding:4px 8px;background:#e7f0e8;border-radius:4px}
/* 备注 + 整改跟踪 */
.item-detail .note-lab{font-size:11.5px;font-weight:600;color:#7a5c12;margin-top:10px}
.item-detail .note{width:100%;box-sizing:border-box;min-height:48px;margin-top:3px;padding:7px 9px;font-family:inherit;font-size:12.5px;color:#333;line-height:1.55;border:1px solid #d8d0c0;border-radius:6px;background:#fffdf6;resize:vertical}
.item-detail .note:focus{outline:none;border-color:#a8761b;box-shadow:0 0 0 2px rgba(168,118,27,.15)}
.item-detail .rect-row{display:flex;align-items:center;gap:8px;margin-top:8px}
.item-detail .rect-row .rl{font-size:11.5px;font-weight:600;color:#7a5c12;white-space:nowrap}
.item-detail .rect{font-family:inherit;font-size:12px;padding:4px 8px;border-radius:6px;border:1px solid #d8d0c0;background:#fff;color:#333;cursor:pointer}
.item-detail .rect.s-none{background:#f0ede4;color:#888}
.item-detail .rect.s-todo{background:#f3e7e6;color:#9e2b25;border-color:#e3c0bd}
.item-detail .rect.s-doing{background:#fbf0dc;color:#a8761b;border-color:#ecd9a8}
.item-detail .rect.s-done{background:#e7f0e8;color:#2e6b3e;border-color:#bfe0c6}
.tag{display:inline-block;padding:1px 7px;border-radius:3px;font-size:11px;font-weight:600;margin:0 3px}
.t-blue{background:#e8eef4;color:#2f5e8a}
.t-red{background:#f3e7e6;color:#9e2b25}
.t-green{background:#e7f0e8;color:#2e6b3e}

/* 空要素占位 */
.elem-empty{padding:10px 16px;text-align:center;color:#b8b0a0;font-size:12.5px}

.foot{margin-top:24px;border-top:1px solid #d8d0c0;padding-top:12px;color:#888;font-size:11px;text-align:right}

@media print{body{background:#fff}.elem-header{background:#f5f3ee}.elem-body{display:block !important}}
</style>
</head>

// ===== 状态管理 =====
function getState(id){return localStorage.getItem('cma_'+id)==='1'}
function setState(id,v){if(v) localStorage.setItem('cma_'+id,'1');else localStorage.removeItem('cma_'+id)}
function getNote(id){return localStorage.getItem('cma_note_'+id)||''}
function setNote(id,v){if(v&&v.trim()) localStorage.setItem('cma_note_'+id,v);else localStorage.removeItem('cma_note_'+id)}
function getRect(id){return localStorage.getItem('cma_rect_'+id)||'none'}
function setRect(id,v){if(v&&v!=='none') localStorage.setItem('cma_rect_'+id,v);else localStorage.removeItem('cma_rect_'+id)}
// ===== 渲染 =====
function render(){
  const app=document.getElementById('app');
  let html='';
  DATA.forEach((elem,i)=>{
    const n=elem.items.length;
    const done=elem.items.filter(it=>getState(it.id)).length;
    html+=`<div class="elem" data-idx="${i}">
      <div class="elem-header">
        <div class="num">${i+1}</div>
        <span class="title">${elem.title}</span>
        <span class="count">${done}/${n}</span>
        <span class="arrow">▾</span>
      </div>
      <div class="elem-body" id="elemBody${i}">`;
    elem.items.forEach(it=>{
      const s=getState(it.id);
      html+=`<div class="item" data-itemid="${it.id}">
        <div class="item-head">
          <div class="cb ${s?'checked':''}"></div>
          <div class="item-area">
            <div class="txt">${it.t}</div>
            <div class="item-key">🔍 核查要点：${it.key}</div>
          </div>
          <span class="expand">▾</span>
        </div>
        <div class="item-detail">
          ${it.doc?'<div class="lab">📎 佐证材料/对应表格</div><div class="doc">'+it.doc+'</div>':''}
          <div class="lab">📋 准备指引</div>
          <div class="txt">${it.guide}</div>
          <div class="lab">⚠️ 常见不符合项</div>
          <div class="nc">${it.nc}</div>
          <div class="note-lab">📝 我的备注 / 现场记录</div>
          <textarea class="note" data-nid="${it.id}" placeholder="记录本机构现状、待办、缺口…（自动保存到本机）"></textarea>
          <div class="rect-row">
            <span class="rl">整改状态</span>
            <select class="rect s-none" data-rid="${it.id}">
              <option value="none">无</option>
              <option value="todo">待整改</option>
              <option value="doing">整改中</option>
              <option value="done">已关闭</option>
            </select>
          </div>
        </div>
      </div>`;
    });
    html+=`</div></div>`;
  });
  app.innerHTML=html;
  // 填充已保存的备注与整改状态
  app.querySelectorAll('.note').forEach(ta=>{ ta.value=getNote(ta.dataset.nid); });
  app.querySelectorAll('.rect').forEach(sel=>{
    const v=getRect(sel.dataset.rid);
    sel.value=v; sel.className='rect s-'+v;
  });
  updateProgress();
}

// ===== 委托事件 =====
// 备注输入（自动保存）
document.addEventListener('input',function(e){
  const ta=e.target.closest('.note');
  if(ta){ setNote(ta.dataset.nid,ta.value); }
});
// 整改状态切换
document.addEventListener('change',function(e){
  const sel=e.target.closest('.rect');
  if(sel){
    const v=sel.value; setRect(sel.dataset.rid,v);
    sel.className='rect s-'+v;
  }
});
document.addEventListener('click',function(e){
  // 复选框勾选（只切换通过状态，不触发展开折叠）
  const cb=e.target.closest('.item-head .cb');
  if(cb){
    const item=cb.closest('.item');
    const id=item.dataset.itemid;
    const v=!getState(id);
    setState(id,v);
    cb.classList.toggle('checked',v);
    updateProgress();
    // 更新要素标题计数
    const elem=item.closest('.elem');
    const idx=parseInt(elem.dataset.idx);
    const did=DATA[idx].items.filter(it=>getState(it.id)).length;
    elem.querySelector('.count').textContent=did+'/'+DATA[idx].items.length;
    return;
  }
  // 测查项点击 → 切换展开详情（准备指引+不符合项）
  const head=e.target.closest('.item-head');
  if(head){
    head.classList.toggle('open');
    const detail=head.nextElementSibling;
    if(detail&&detail.classList.contains('item-detail')) detail.classList.toggle('open');
    return;
  }
  // 要素面板展开/收起
  const eh=e.target.closest('.elem-header');
  if(eh){
    eh.classList.toggle('open');
    eh.nextElementSibling.classList.toggle('open');
  }
});

function updateProgress(){
  let total=0,done=0;
  DATA.forEach(elem=>{
    elem.items.forEach(it=>{
      total++;
      if(getState(it.id)) done++;
    });
  });
  document.getElementById('progText').textContent='已核查 '+done+' / '+total+' 项';
  const pct=total>0?Math.round(done/total*100):0;
  document.getElementById('progPct').textContent=pct+'%';
  const fill=document.getElementById('progFill');
  fill.style.width=pct+'%';
  fill.className='fill'+(pct<30?' warn':pct<80?'':' good');
}

// ===== 初始化 =====
render();
</script>
